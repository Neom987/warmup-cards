<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:#000;overflow:hidden}
  iframe{display:block;border:0}
</style>
</head><body>
<iframe id="f" src="../index.html"></iframe>
<script>
/* 静态截图驱动器：把 index.html 放进固定尺寸 iframe，按 ?step= 触发到某个状态。
   配合 msedge --headless=new --force-prefers-reduced-motion --screenshot=... 使用。
   注意：必须用独立 --user-data-dir，否则 localStorage 里的 hb_theme / hb_seen 会串场。 */
const q = new URLSearchParams(location.search);
const step = q.get('step') || 'start';
const W = +(q.get('w') || 390), H = +(q.get('h') || 844);
const f = document.getElementById('f');
f.style.width = W + 'px';
f.style.height = H + 'px';

f.addEventListener('load', async () => {
  const w = f.contentWindow, d = f.contentDocument;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const click = el => el && el.dispatchEvent(new w.MouseEvent('click', { bubbles: true }));
  await sleep(350);

  if (q.get('theme') === 'night') { click(d.querySelector('#kTheme')); await sleep(250); }
  if (q.get('mode') === 'endless') { click(d.querySelectorAll('#segTotal button')[3]); await sleep(120); }

  if (step !== 'start') { click(d.querySelector('#kStart')); await sleep(2100); }
  if (step === 'hold') await sleep(9000);
  if (step === 'stamp') { await sleep(300); click(d.querySelector('#kAnswer')); await sleep(300); }
  if (step === 'timer') { click(d.querySelector('#kTimer')); await sleep(2600); }
  if (step === 'report') {
    for (let i = 0; i < 40; i++) {
      if (!d.querySelector('#reportLayer').hidden) break;
      click(d.querySelector('#kAnswer'));
      await sleep(+(q.get('gap') || 830));
    }
    await sleep(1300);
  }
});
</script>
</body></html>
